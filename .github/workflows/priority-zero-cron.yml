name: Priority zero background jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  process-mailbox:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run scheduled sends, reminders and Gmail watch renewal
        env:
          APP_URL: ${{ secrets.EMAIL_ORGANIZER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "EMAIL_ORGANIZER_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          curl --fail --show-error --silent --retry 2 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/priority-zero"
